<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>


<div class="container-fluid background" style="padding-top: 12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card" >
        <div class="card-body shadow-lg grad">
          <form name="assetForm">
            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Add Event' | translate }}
            </h2>
            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Update Event' | translate }}
            </h2>

            <!-- Form error messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>
            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Name Field with Validation -->

            <div class="form-group pt-2">
              <label><b>{{ 'EventName' | translate }}</b><span class="required-field">*</span></label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-paint-brush grey-text"></i></div>
                </div>
                <select class="form-control" name="eventName" [(ngModel)]="form.data.eventName"
                  aria-label="ngSelected" required>
                  <option [ngValue]="undefined">{{ 'Select eventName' | translate }}</option>
                  <option value="Music Festival">{{ 'Music Festival' | translate }}</option>
                  <option value="Tech Conference">{{ 'Tech Conference' | translate }}</option>
                  <option value="Startup Meetup">{{ 'Startup Meetup' | translate }}</option>
                </select>
              </div>
              <span *ngIf="form.inputerror?.eventName" class="alertRedColor">{{ form.inputerror.eventName }}</span>
            </div>


            <!-- Dob-->

          <div>
         
             <span class="pt-2"><b>{{'BookingDate' | translate }}</b>
              <span class="required-field"></span></span>

            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text"><i class="fa fa-table grey-text"></i> </div>
                </div>
                <input type="date" name="bookingDate" [value]="form.data.bookingDate | date:'yyyy-MM-dd'"
                  (input)="form.data.bookingDate=parseDate($event.target.value)" class="form-control form-control-sm"
                  required />
              </div>
            </div>
<span *ngIf="form.inputerror.bookingDate != null" class="alertRedColor" style=" color: red;"> {{form.inputerror.bookingDate}} </span>
            
          </div>


            <div class="form-group pt-2">
              <label>
                <b>{{ 'Seats' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-phone grey-text"></i>
                  </div>
                </div>

                <input type="text" name="seats" [(ngModel)]="form.data.seats" #contactNumber="ngModel"
                  class="form-control"  maxlength="10" pattern="^[0-9]{10}$"
                  (keydown)="filterInputS($event, 'errorMessageseats', 10, 'int')"
                  placeholder="{{ 'Enter Seats' | translate }}">
              </div>

              <!-- Custom validation messages from component -->
              <span *ngIf="form.inputerror?.seats" class="alertRedColor">{{ form.inputerror.seats
                }}</span>
            </div>


            

            <div class="row pt-2 pl-2 pb-3">

              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Save' | translate }}
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Update' | translate }}
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1" type="button" [routerLink]="['/eventlist']"
                  style="text-decoration: none; color: white;">
                  {{ 'List' | translate }}
                </a>
              </div>

            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
